name: Dependency Lockfile Check

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 001-school-management-system

permissions:
  contents: read

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lockfile:
    name: Verify package-lock consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate lockfile and install deterministically
        run: npm ci --prefer-offline --no-audit --fund=false --legacy-peer-deps

      - name: Ensure lockfile was not modified
        run: git diff --exit-code -- package-lock.json
