name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - '[0-9][0-9][0-9]-**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-check:
    name: Verify Lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate lockfile and install deterministically
        run: npm ci --prefer-offline --no-audit --fund=false --legacy-peer-deps

      - name: Ensure lockfile was not modified
        run: git diff --exit-code -- package-lock.json

  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    needs: lockfile-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false --legacy-peer-deps

      - name: Run lint
        run: npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test_db"
      DIRECT_URL: "postgresql://test:test@localhost:5432/test_db"
      NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-key"
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
      SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
      SUPABASE_JWT_SECRET: "test-jwt-secret"
      NODE_ENV: "development"
      CI: "true"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npm run seed

      - name: Run tests
        run: npm test
